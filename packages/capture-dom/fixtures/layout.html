<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Layout</title>
    <style>
      body { margin: 0; font: 16px/1.5 Arial, sans-serif; }
      @media (min-width: 100px) {
        .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) 100px; gap: 4px 8px; width: 500px; }
      }
      .span { grid-column: span 2; }
      .full { grid-column: 1 / -1; }
      .plain { display: grid; grid-template-columns: 100px 200px; }
      .bar { display: flex; width: 500px; }
      .push { margin-left: auto; }
    </style>
  </head>
  <body>
    <div class="cards" id="cards">
      <div class="span">Span</div>
      <div>One</div>
      <div class="full">Full</div>
    </div>
    <div class="plain" id="plain"><div>A</div><div>B</div></div>
    <div id="inline" style="display: grid; grid-template-columns: 1fr 3fr; width: 400px"><div>A</div><div>B</div></div>
    <div class="bar" id="bar"><div>Logo</div><div class="push" id="push">Menu</div></div>
    <div id="host"></div>
    <script>
      const root = document.getElementById("host").attachShadow({ mode: "open" });
      root.innerHTML = '<style>.in { display: grid; grid-template-columns: 2fr 1fr; width: 300px; }</style><div class="in"><div>A</div><div>B</div></div>';
    </script>
  </body>
</html>
