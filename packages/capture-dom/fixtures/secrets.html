<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secrets in URLs</title>
<style>
:root {
  --hero: url("/assets/photo.png?token=SECRET-VAR-TOKEN");
  --session-token: SECRET-VAR-SESSION;
  --jwt: eyJhbGciOiJIUzI1NiJ9.SECRET-VAR-JWT.abc;
  --api-fallback: var(--missing, SECRET-VAR-FALLBACK);
  --brand: #336699;
  --brand-named: rebeccapurple;
  --brand-alias: var(--brand);
  --brand-fallback: var(--missing, #123456);
  --gap: 16px;
  --relative: "/reset?token=SECRET-VAR-RELATIVE";
  --api: https://SECRET-VAR-USER:SECRET-VAR-PASS@api.example.com/v1?key=SECRET-VAR-KEY;
}
body { margin: 0; font: 14px/1.4 Arial, sans-serif; }
img, .box, iframe, video, a { display: block; width: 50px; height: 50px; }
a { background: #eee; }
.filtered { filter: url("/filters.svg?token=SECRET-FILTER-TOKEN#blur"); }
.link-text::after { content: attr(href); }
.editable { width: 200px; height: 40px; border: 1px solid #888; }
.editable::before { content: "SECRET-EDITABLE-PSEUDO"; }
.editable::after { content: attr(data-draft); background: #eee; }
</style>
</head>
<body>
<img id="ok" src="/assets/photo.png?token=SECRET-IMG-TOKEN&sig=abc#SECRET-IMG-FRAGMENT" alt="ok">
<img id="blocked" src="http://localhost:4174/assets/logo.svg?token=SECRET-BLOCKED-TOKEN" alt="blocked">
<img id="broken" src="/missing.png?token=SECRET-BROKEN-TOKEN" alt="broken">
<a href="/reset?token=SECRET-HREF-TOKEN#SECRET-HREF-FRAGMENT">reset</a>
<a href="http://SECRET-USER:SECRET-PASS@localhost:4173/account">account</a>
<a href="mailto:ada@example.com?subject=SECRET-MAIL-TOKEN">mail</a>
<a href="javascript:void('SECRET-JS-TOKEN')">run</a>
<iframe src="http://localhost:4174/?auth=SECRET-IFRAME-TOKEN"></iframe>
<video poster="/assets/photo.png?token=SECRET-POSTER-TOKEN"></video>
<div class="box" style="background: url('/assets/photo.png?token=SECRET-BG-TOKEN')"></div>
<div class="box" style="background: url('http://localhost:4174/assets/logo.svg?token=SECRET-BG-BLOCKED')"></div>
<div class="box" style="background: image-set(url('/assets/photo.png?token=SECRET-SET-TOKEN') 1x)"></div>
<div class="box filtered"></div>
<a class="link-text" href="/reset?token=SECRET-ATTR-RELATIVE"></a>
<a class="link-text" href="//cdn.test/x?token=SECRET-ATTR-PROTOCOL"></a>
<a class="link-text" href="https://a.test/x,y?token=SECRET-ATTR-COMMA"></a>
<a class="link-text" href="https://a.test/(x)?token=SECRET-ATTR-PAREN"></a>
<div id="draft" class="editable" contenteditable role="textbox" data-draft="SECRET-EDITABLE-ATTR">SECRET-EDITABLE-DRAFT<b>SECRET-EDITABLE-NESTED</b></div>
<p id="sentence">Dear <span contenteditable="true">SECRET-EDITABLE-INLINE</span> reader</p>
<div contenteditable="plaintext-only" style="display: contents">SECRET-EDITABLE-CONTENTS</div>
<div contenteditable="TRUE">SECRET-EDITABLE-CASE</div>
<div id="fixed" contenteditable="false">Read only text</div>
<div id="slot-light"><slot contenteditable>SECRET-EDITABLE-SLOT</slot></div>
<x-slotted>SECRET-EDITABLE-SLOTTED</x-slotted>
<x-framed id="flat-label">SECRET-EDITABLE-FLAT-LABEL</x-framed>
<svg id="flat-labelled" width="20" height="20" aria-labelledby="flat-label"><rect width="20" height="20"/></svg>
<x-framed><svg width="20" height="20"><text id="flat-sprite">SECRET-EDITABLE-FLAT-SVG</text></svg></x-framed>
<svg id="flat-sprite-user" width="20" height="20"><use href="#flat-sprite"/></svg>
<x-editor mode="open"></x-editor>
<x-editor mode="closed"></x-editor>
<p id="named-by">Named <span contenteditable>SECRET-EDITABLE-LABEL</span></p>
<svg id="labelled" width="20" height="20" aria-labelledby="named-by"><rect width="20" height="20"/></svg>
<svg id="sprite-user" width="20" height="20"><use href="#sprite-text"/></svg>
<div contenteditable><svg width="20" height="20"><text id="sprite-text">SECRET-EDITABLE-SVG</text></svg></div>
<script>
  const closedRoots = new WeakMap();
  window.__frottageClosedRoots = closedRoots;
  for (const host of document.querySelectorAll("x-editor")) {
    const mode = host.getAttribute("mode");
    const root = host.attachShadow({ mode });
    closedRoots.set(host, root);
    root.innerHTML = `<div class="box" contenteditable>SECRET-EDITABLE-${mode}-SHADOW</div>`;
  }
  for (const host of document.querySelectorAll("x-slotted")) {
    host.attachShadow({ mode: "open" }).innerHTML = "<slot contenteditable></slot>";
  }
  for (const host of document.querySelectorAll("x-framed")) {
    host.attachShadow({ mode: "open" }).innerHTML = "<div contenteditable><slot></slot></div>";
  }
  history.replaceState(null, "", "?session=SECRET-PAGE-TOKEN#SECRET-PAGE-FRAGMENT");
</script>
</body>
</html>
