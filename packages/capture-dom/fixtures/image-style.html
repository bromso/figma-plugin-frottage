<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image styles</title>
<style>
body { margin: 0; }
img { display: block; width: 100px; height: 100px; }
</style>
</head>
<body>
<img src="/assets/photo.png" alt="plain">
<img src="/assets/photo.png" alt="hidden" style="opacity: 0">
<img src="/assets/photo.png" alt="half" style="opacity: 0.5">
<img src="/assets/photo.png" alt="avatar" style="border-radius: 50%; border: 4px solid red">
</body>
</html>
